name: Code quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 1. Instala o pnpm PRIMEIRO
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 2. Configura o Node e ativa o cache usando o pnpm instalado acima
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Usa a versão do Biome travada no seu package.json
      - name: Run Biome
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test
